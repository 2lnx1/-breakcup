<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1d1d1b"><link rel="manifest" href="manifest.webmanifest"><title>BREAK CUP</title><style>body{margin:0;background:#f8f6f2;color:#1d1d1b;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:560px;margin:auto;padding:20px 18px 120px}.top{text-align:center;font-weight:900;letter-spacing:3px;font-size:22px}.hero{background:#1d1d1b;color:white;border-radius:28px;padding:28px;margin:22px 0}.hero b{display:block;font-size:38px;line-height:.9}.hero span{display:block;margin-top:16px;color:#ccc}h1{font-size:28px}.card{background:#fff;border-radius:22px;padding:17px;margin:10px 0;display:flex;align-items:center;gap:14px}.icon{width:58px;height:58px;border-radius:18px;background:#e8e1d6;display:grid;place-items:center;font-size:28px}.info{flex:1}.name{font-size:17px;font-weight:800}.sub{color:#777;margin-top:4px}.price{font-weight:900;margin-top:5px}.add{border:0;border-radius:14px;background:#1d1d1b;color:#fff;width:44px;height:44px;font-size:24px}.cart{position:fixed;bottom:16px;left:16px;right:16px;max-width:524px;margin:auto;background:#1d1d1b;color:#fff;border-radius:20px;padding:13px 16px;display:flex;align-items:center}.cart button{background:#fff;color:#1d1d1b;border:0;border-radius:14px;padding:11px 16px;font-weight:800;margin-left:10px}.overlay{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end}.sheet{background:#f8f6f2;width:100%;max-width:560px;margin:auto;border-radius:28px 28px 0 0;padding:24px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ddd}.confirm{width:100%;background:#1d1d1b;color:#fff;border:0;border-radius:14px;padding:14px;font-weight:800}</style></head><body><main><div class="top">BREAK CUP</div><section class="hero"><b>BREAK</b><b>CUP</b><span>قهوتك.. على وقتك ☕</span></section><h1>V60</h1><div id="products"></div></main><div id="cart" class="cart" style="display:none"><button onclick="openCart()">السلة</button><span id="summary"></span></div><div id="overlay" class="overlay" onclick="if(event.target===this)closeCart()"><section class="sheet"><h2>طلبك</h2><div id="items"></div><h3 id="total"></h3><button class="confirm" onclick="closeCart()">تأكيد الطلب</button></section></div><script>const products=[['قهوة اليوم','بارد','كبير',10],['قهوة اليوم','حار','كبير',10],['قهوة اليوم','بارد','صغير',8],['قهوة اليوم','حار','صغير',8]],cart=[0,0,0,0];function render(){products.forEach((p,i)=>document.getElementById('products').innerHTML+=`<div class="card"><div class="icon">☕</div><div class="info"><div class="name">${p[0]} ${p[1]}</div><div class="sub">${p[2]}</div><div class="price">${p[3]} ر.س</div></div><button class="add" onclick="add(${i})">+</button></div>`)}function add(i){cart[i]++;update()}function update(){let c=cart.reduce((a,b)=>a+b,0),t=cart.reduce((s,q,i)=>s+q*products[i][3],0);document.getElementById('cart').style.display=c?'flex':'none';document.getElementById('summary').textContent=`${c} منتجات • ${t} ر.س`}function openCart(){let t=cart.reduce((s,q,i)=>s+q*products[i][3],0);document.getElementById('items').innerHTML=cart.map((q,i)=>q?`<div class="row"><span>${products[i][0]} ${products[i][1]} ${products[i][2]} × ${q}</span><b>${q*products[i][3]} ر.س</b></div>`:'').join('')||'<p>السلة فارغة</p>';document.getElementById('total').textContent=`الإجمالي: ${t} ر.س`;document.getElementById('overlay').style.display='flex'}function closeCart(){document.getElementById('overlay').style.display='none'}render();</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')</script></body></html>
